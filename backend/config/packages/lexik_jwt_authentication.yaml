lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # There's no refresh-token flow in this app, so an expired token just logs
    # the user out — 24h avoids annoying re-logins for a low-stakes, single-user
    # personal finance tracker. Revisit (shorter TTL + refresh tokens) if this
    # ever serves multiple untrusted users or higher-stakes data.
    token_ttl: 86400
