server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # vue-router uses history mode — fall back to index.html for any
        # path that isn't a real static file, so client-side routes work
        # on a hard refresh / direct URL visit.
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no entry for this extension, so it
    # would otherwise serve the PWA manifest as application/octet-stream.
    # Scoped to this one location so it can't shadow the real mime.types
    # map used everywhere else.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }
}
