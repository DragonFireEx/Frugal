server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # vue-router uses history mode — fall back to index.html for any
        # path that isn't a real static file, so client-side routes work
        # on a hard refresh / direct URL visit.
        try_files $uri $uri/ /index.html;
    }
}
