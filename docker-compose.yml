services:
  database:
    image: postgres:16-alpine
    container_name: frugal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: frugal
      POSTGRES_USER: frugal_user
      POSTGRES_PASSWORD: frugal_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frugal_user -d frugal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: frugal_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://frugal_user:frugal_pass@database:5432/frugal?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy

  # Catches budget-exceeded notification emails in dev instead of discarding
  # them (.env's MAILER_DSN=null://) or requiring real SMTP credentials. Web
  # UI at http://localhost:8025.
  mailer:
    image: axllent/mailpit
    container_name: frugal_mailer
    restart: unless-stopped
    ports:
      - "8025:8025"

  scheduler:
    build:
      context: ./backend
    container_name: frugal_scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://frugal_user:frugal_pass@database:5432/frugal?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy
    # No dedicated job scheduler (Symfony Scheduler, cron) is installed in the
    # image, so this loop just re-runs the (idempotent) generation command
    # hourly - proportionate to a single-user app's needs.
    entrypoint: ["sh", "-c", "while true; do php bin/console app:generate-recurring-transactions --no-interaction; sleep 3600; done"]

  nginx:
    image: nginx:alpine
    container_name: frugal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: frugal_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080/api"
    depends_on:
      - nginx

volumes:
  db_data:
  frontend_node_modules:
